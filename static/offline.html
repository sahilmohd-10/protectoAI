<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#285843">
  <title>Offline | Protecto.AI</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #1c2821; background: #eef1eb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid #d9e0d8; border-top: 3px solid #c18a49; background: #fff; box-shadow: 0 12px 36px #1c282115; }
    .brand { margin: 0 0 30px; color: #285843; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
    .eyebrow { color: #8b642f; font: 600 11px/1.4 monospace; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: 28px; line-height: 1.1; }
    p { color: #526157; font-size: 14px; line-height: 1.6; }
    button { margin-top: 12px; padding: 11px 16px; border: 0; border-radius: 3px; background: #285843; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Protecto.AI</p>
    <p class="eyebrow">Connection unavailable</p>
    <h1>You're offline</h1>
    <p>Your monitoring workspace needs a connection to load account data, camera feeds, and incident records.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
